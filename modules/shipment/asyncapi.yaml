asyncapi: 3.0.0
info:
  title: Shipment Module Messaging
  version: 0.1.0
  description: >-
    Integration messages published and consumed by the Shipment bounded
    context through RabbitMQ, using the transactional outbox/inbox pattern.

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    description: Local RabbitMQ broker

channels:
  shipmentEvents:
    address: trade-logistics.topic
    title: Shipment integration events
    description: >-
      Topic exchange every module publishes to. Messages of this module are
      routed under `trade-logistics.shipment.*`, so a consumer can subscribe to
      one behaviour or to everything the module emits.
    messages:
      ShipmentManifestFinalized:
        $ref: '#/components/messages/ShipmentManifestFinalized'
      ShipmentDelayedExceptionRaised:
        $ref: '#/components/messages/ShipmentDelayedExceptionRaised'

operations:
  publishShipmentManifestFinalized:
    action: send
    channel:
      $ref: '#/channels/shipmentEvents'
    title: Publish ShipmentManifestFinalized
    summary: >-
      Written to `shipment.outbox_messages` by the *finalize cargo manifest*
      use case, in the same transaction as the state change, and relayed by
      `worker.py dispatch-messages --module shipment` with routing key
      `trade-logistics.shipment.manifest-finalized`.
    messages:
      - $ref: '#/components/messages/ShipmentManifestFinalized'

components:
  messages:
    ShipmentManifestFinalized:
      name: ShipmentManifestFinalized
      title: Shipment manifest finalized
      summary: Published from `shipment.outbox_messages` once the cargo is declared.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, waybill_number, commodity_code]
        properties:
          shipment_id:
            type: string
            format: uuid
          waybill_number:
            type: string
            pattern: '^MUST-[0-9]{7}$'
          commodity_code:
            type: string

    ShipmentDelayedExceptionRaised:
      name: ShipmentDelayedExceptionRaised
      title: Shipment operational exception raised
      summary: Published when an operator flags damage or a delay at port.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, reason]
        properties:
          shipment_id:
            type: string
            format: uuid
          reason:
            type: string

    CustomsClearanceApproved:
      name: CustomsClearanceApproved
      title: Customs clearance approved
      summary: Consumed into `shipment.inbox_messages` to release the cargo.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, clearance_token]
        properties:
          shipment_id:
            type: string
            format: uuid
          clearance_token:
            type: string
