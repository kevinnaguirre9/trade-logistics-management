asyncapi: 3.0.0
info:
  title: Customs Clearance Module Messaging
  version: 0.1.0
  description: >-
    Integration messages published and consumed by the Customs Clearance
    bounded context through RabbitMQ, using the transactional outbox/inbox
    pattern.

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    description: Local RabbitMQ broker

channels:
  shipmentEvents:
    address: trade-logistics.topic
    title: Shipment integration events
    description: >-
      Topic exchange the Shipment module publishes to. This module binds its
      queue with `trade-logistics.shipment.#`.
    messages:
      ShipmentManifestFinalized:
        $ref: '#/components/messages/ShipmentManifestFinalized'

  customsEvents:
    address: trade-logistics.topic
    title: Customs integration events
    description: >-
      The same topic exchange, carrying the messages this module publishes
      under `trade-logistics.customs.*`.
    messages:
      CustomsDutyAssessed:
        $ref: '#/components/messages/CustomsDutyAssessed'
      CustomsClearanceRejected:
        $ref: '#/components/messages/CustomsClearanceRejected'
      CustomsClearanceApproved:
        $ref: '#/components/messages/CustomsClearanceApproved'

operations:
  consumeShipmentManifestFinalized:
    action: receive
    channel:
      $ref: '#/channels/shipmentEvents'
    title: Consume ShipmentManifestFinalized
    summary: >-
      Handled by `OpenClearanceCaseMessageHandler`, which opens a clearance
      case in `Opened` state. The case and the `customs.inbox_messages` row
      recording the delivery are written in one transaction, so a redelivery
      opens no second case. Run with
      `worker.py handle-messages --module customs_clearance`.
    messages:
      - $ref: '#/components/messages/ShipmentManifestFinalized'

components:
  messages:
    ShipmentManifestFinalized:
      name: ShipmentManifestFinalized
      title: Shipment manifest finalized
      summary: Consumed into `customs.inbox_messages` to open a clearance case.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, commodity_code]
        properties:
          shipment_id:
            type: string
            format: uuid
          commodity_code:
            type: string

    CustomsDutyAssessed:
      name: CustomsDutyAssessed
      title: Customs duty assessed
      summary: Published from `customs.outbox_messages` when a duty becomes payable.
      contentType: application/json
      payload:
        type: object
        required: [case_id, shipment_id, duty_amount, currency]
        properties:
          case_id:
            type: string
            format: uuid
          shipment_id:
            type: string
            format: uuid
          duty_amount:
            type: number
          currency:
            type: string
            minLength: 3
            maxLength: 3

    CustomsClearanceRejected:
      name: CustomsClearanceRejected
      title: Customs clearance rejected
      summary: Published when the risk assessment rejects the case.
      contentType: application/json
      payload:
        type: object
        required: [case_id, shipment_id, risk_score]
        properties:
          case_id:
            type: string
            format: uuid
          shipment_id:
            type: string
            format: uuid
          risk_score:
            type: integer

    CustomsClearanceApproved:
      name: CustomsClearanceApproved
      title: Customs clearance approved
      summary: Published once the duty payment is recorded and the case released.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, clearance_token]
        properties:
          shipment_id:
            type: string
            format: uuid
          clearance_token:
            type: string
