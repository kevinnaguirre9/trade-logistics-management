[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-logistics-management"
version = "0.1.0"
description = "International Freight & Customs Clearance modular monolith."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kevin Aguirre" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["modules"]

# ---------------------------------------------------------------------------
# Style: PEP 8 enforced through Ruff (pycodestyle + pyflakes + isort + naming).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["alembic/versions", "**/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The project ships an ./alembic directory, so Ruff would otherwise take the
# Alembic package itself for first-party code.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests", "modules/shipment/test", "modules/customs_clearance/test"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
