# Alembic configuration.
#
# Each module owns its migration history: revisions live inside the module
# (see `version_locations`) and are grouped by branch label ("shipment",
# "customs_clearance"). The connection URL is injected at runtime by
# alembic/env.py from the application settings, so it is left empty here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = space
version_locations = modules/shipment/src/infrastructure/database/migrations modules/customs_clearance/src/infrastructure/database/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
