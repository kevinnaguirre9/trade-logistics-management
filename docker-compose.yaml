name: trade-logistics-management

services:
  app:
    build:
      context: .
      target: runtime
    container_name: tlm-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    command:
      - uvicorn
      - main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    ports:
      - "${APP_PORT_FORWARD:-8000}:8000"
    volumes:
      # Live-reload during development; drop this mount for production images.
      - ./modules:/app/modules
      - ./main.py:/app/main.py
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tlm-network

  postgres:
    image: postgres:17-alpine
    container_name: tlm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tlm-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tlm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT_FORWARD:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tlm-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tlm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT_FORWARD:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT_FORWARD:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - tlm-network

  # Test runner. Not part of `docker compose up`: it sits behind the "test"
  # profile and is meant for `docker compose run --rm test`. The suite is
  # database-free (domain unit tests, plus endpoint tests that override the
  # handler dependency), so it declares no depends_on.
  test:
    build:
      context: .
      target: dev
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./modules:/app/modules
      - ./tests:/app/tests
      - ./conftest.py:/app/conftest.py
      - ./pyproject.toml:/app/pyproject.toml
      - ./main.py:/app/main.py
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    networks:
      - tlm-network

volumes:
  postgres-data:
  pgadmin-data:
  rabbitmq-data:

networks:
  tlm-network:
    driver: bridge
